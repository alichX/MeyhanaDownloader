[project]
name = "MeyhanaDownloader"
version = "0.3.0"
requires-python = ">=3.9"
dependencies = [
    "flet==1.1.3",
    "yt-dlp",
    "mutagen",
    "pillow",
    "flet-notifications",
    "flet-shadcn-ui"
]

[tool.flet.app]
path = "src"
module = "main"

[tool.flet]
assets = ["src/config"] # или "config", если путь от корня проекта